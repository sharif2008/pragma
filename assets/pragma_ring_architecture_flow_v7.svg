<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="-80 0 840 850" role="img" aria-labelledby="title desc">
<title id="title">Pragma circular blockchain architecture with retry and human-in-the-loop</title>
<desc id="desc">Five agents sit on a perfect ring around the blockchain layer, each in its own color. The event listener sits on the left. The human loop sits on the outer arc between the orchestrator and the governance agent. Verify-fail follows that arc; the human updates governance only.</desc>

